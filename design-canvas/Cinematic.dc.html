<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Outfit, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #D9B478; text-decoration: none; } a:hover { color: #F0D6A6; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }

    @keyframes cIn   { from { opacity: 0; transform: translateY(22px) scale(.985); } }
    @keyframes cRow  { from { opacity: 0; transform: translateX(-18px); } }
    @keyframes cDrift{ 0% { transform: scale(1.06) translate(0,0); } 100% { transform: scale(1.14) translate(-1.6%, -1.2%); } }
    @keyframes cSweep{ 0%,100% { opacity: .3; } 50% { opacity: .55; } }

    .stage { width: 1240px; height: 880px; position: relative; overflow: hidden; background: #09090A;
             display: flex; align-items: center; justify-content: center; }
    /* The lecture's own frame, behind everything. */
    .plate { position: absolute; inset: -8%;
             background:
               radial-gradient(60% 50% at 62% 34%, rgba(217,180,120,.20), transparent 70%),
               radial-gradient(46% 44% at 26% 68%, rgba(120,96,64,.16), transparent 72%),
               linear-gradient(148deg, #2C2318 0%, #191518 46%, #0B0B0D 100%);
             filter: blur(3px) saturate(1.06);
             animation: cDrift 34s ease-in-out infinite alternate; }
    .vig { position: absolute; inset: 0;
           background: radial-gradient(70% 62% at 50% 44%, rgba(6,6,8,.30), rgba(6,6,8,.90) 96%); }
    .beam { position: absolute; left: 50%; top: -40%; width: 640px; height: 1100px; margin-left: -320px;
            background: linear-gradient(180deg, rgba(217,180,120,.16), transparent 62%);
            filter: blur(52px); animation: cSweep 12s ease-in-out infinite; }
    .grain { position: absolute; inset: 0; opacity: .5;
             background-image: radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
             background-size: 3px 3px; }

    .glass { position: relative; width: 940px; padding: 46px 54px 34px; border-radius: 20px;
             background: rgba(14,14,17,.62); border: 1px solid rgba(255,255,255,.07);
             backdrop-filter: blur(26px) saturate(1.2);
             box-shadow: 0 50px 130px rgba(0,0,0,.66), inset 0 1px 0 rgba(255,255,255,.055);
             animation: cIn .62s cubic-bezier(.2,.8,.2,1) backwards; }

    .head { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
    .live { width: 6px; height: 6px; border-radius: 50%; background: #D9B478; flex: none;
            box-shadow: 0 0 12px rgba(217,180,120,.8); }
    .src { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #8B8B93; }
    .dur { margin-left: auto; font-size: 11px; letter-spacing: .16em; color: #62626B; font-variant-numeric: tabular-nums; }

    .steps { display: flex; gap: 6px; margin-bottom: 30px; }
    .seg { height: 2px; flex: 1; background: rgba(255,255,255,.09); border-radius: 2px; overflow: hidden; }
    .seg > i { display: block; height: 100%; background: #D9B478; box-shadow: 0 0 10px rgba(217,180,120,.6); }

    .kicker { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #D9B478; font-weight: 500; }
    h1 { font-size: 54px; line-height: 1.04; font-weight: 300; color: #FFFFFF; letter-spacing: -.028em;
         margin: 16px 0 0; max-width: 16ch; }
    h1 em { font-style: normal; color: #F0D6A6; }
    .sub { margin-top: 16px; font-size: 14px; line-height: 1.6; color: #A2A2AA; max-width: 50ch; text-wrap: pretty; }

    .write { width: 100%; margin-top: 34px; background: rgba(0,0,0,.28); border: 0;
             border-bottom: 1px solid rgba(255,255,255,.13); padding: 15px 17px;
             font-size: 17px; font-weight: 300; color: #FFFFFF; border-radius: 8px 8px 0 0;
             transition: border-color .3s ease, background .3s ease; }
    .write::placeholder { color: rgba(255,255,255,.26); }
    .write:focus { outline: none; border-bottom-color: #D9B478; background: rgba(0,0,0,.4); }

    .rows { margin-top: 26px; display: flex; flex-direction: column; gap: 2px; }
    .row { display: flex; align-items: center; gap: 16px; padding: 13px 16px; border-radius: 9px;
           transition: background .26s ease, transform .26s cubic-bezier(.2,.8,.2,1);
           animation: cRow .5s cubic-bezier(.2,.8,.2,1) backwards; }
    .row:nth-child(1) { animation-delay: .1s; } .row:nth-child(2) { animation-delay: .16s; }
    .row:nth-child(3) { animation-delay: .22s; } .row:nth-child(4) { animation-delay: .28s; }
    .row:hover { background: rgba(255,255,255,.045); transform: translateX(5px); }
    .num { font-size: 11px; color: #62626B; font-variant-numeric: tabular-nums; width: 18px; flex: none; }
    .rowT { font-size: 16px; font-weight: 300; color: #BCBCC3; transition: color .26s ease; }
    .row:hover .rowT { color: #FFFFFF; }
    .rowGo { margin-left: auto; opacity: 0; color: #D9B478; transition: opacity .26s ease, transform .26s ease;
             transform: translateX(-6px); }
    .row:hover .rowGo { opacity: 1; transform: translateX(0); }

    .foot { display: flex; align-items: center; gap: 18px; margin-top: 38px; padding-top: 22px;
            border-top: 1px solid rgba(255,255,255,.07); }
    .cost { font-size: 12.5px; color: #8B8B93; }
    .cost b { color: #F0D6A6; font-weight: 600; font-variant-numeric: tabular-nums; }
    .go { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 13px 24px;
          border-radius: 11px; background: #D9B478; color: #0E0E11; font-size: 14px; font-weight: 600;
          transition: all .26s cubic-bezier(.2,.8,.2,1); }
    .go:hover { background: #F0D6A6; transform: translateY(-2px); box-shadow: 0 14px 34px rgba(217,180,120,.28); }
    .back { font-size: 13px; color: #62626B; } .back:hover { color: #BCBCC3; }

    @media (prefers-reduced-motion: reduce) {
      .glass, .row, .plate, .beam { animation: none; }
      .row, .go, .rowGo { transition: none; }
    }
  </style>
</helmet>

<div class="stage">
  <div class="plate"></div>
  <div class="beam"></div>
  <div class="vig"></div>
  <div class="grain"></div>

  <div class="glass">
    <div class="head">
      <span class="live"></span>
      <div class="src">MOST Muslims Don&#39;t Realize This About Allah</div>
      <div class="dur">32:16</div>
    </div>

    <div class="steps">
      <sc-for list="{{ segs }}" as="s" hint-placeholder-count="8">
        <div class="seg"><i style="{{ s.w }}"></i></div>
      </sc-for>
    </div>

    <div class="kicker">Brief · optional</div>
    <h1>What would you like <em>clipped?</em></h1>
    <div class="sub">Name a subject and the clipper goes looking for it. Leave it be, and it takes the strongest moments on its own.</div>

    <input class="write" placeholder="the parts about repentance, or the story he tells about his mother">

    <div class="rows">
      <sc-for list="{{ examples }}" as="e" hint-placeholder-count="4">
        <button class="row" onClick="{{ noop }}">
          <span class="num">{{ e.n }}</span>
          <span class="rowT">{{ e.text }}</span>
          <svg class="rowGo" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
        </button>
      </sc-for>
    </div>

    <div class="foot">
      <button class="back">Back</button>
      <div class="cost"><b>32 tokens</b> · ready in 19–32 min</div>
      <button class="go">
        Continue
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1240,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      segs: [1,2,3,4,5,6,7,8].map(function (n) { return { w: 'width: ' + (n <= 1 ? 100 : 0) + '%;' }; }),
      examples: [
        { n: '01', text: 'The parts about repentance and mercy' },
        { n: '02', text: 'Any story he tells' },
        { n: '03', text: 'Advice for young Muslims' },
        { n: '04', text: 'Where he speaks about the hereafter' },
      ],
      noop: function () {},
    };
  }
}
</script>
</body>
</html>
