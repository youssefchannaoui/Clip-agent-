<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Outfit:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Outfit, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #D9B478; text-decoration: none; } a:hover { color: #F0D6A6; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }

    @keyframes eRise  { from { opacity: 0; transform: translateY(18px); } }
    @keyframes eInA   { from { opacity: 0; transform: translateY(16px); } }
    @keyframes eInB   { from { opacity: 0; transform: translateY(16px); } }
    @keyframes eBackA { from { opacity: 0; transform: translateY(-16px); } }
    @keyframes eBackB { from { opacity: 0; transform: translateY(-16px); } }
    @keyframes eGlow  { 0%,100% { opacity: .4; } 50% { opacity: .66; } }
    @keyframes eRule  { from { transform: scaleX(0); } }

    .stage { width: 1240px; height: 880px; background: #09090A; position: relative; overflow: hidden;
             display: flex; align-items: center; justify-content: center; }
    .halo { position: absolute; left: 50%; top: -320px; width: 1000px; height: 760px; margin-left: -500px;
            background: radial-gradient(closest-side, rgba(217,180,120,.10), rgba(217,180,120,0) 70%);
            animation: eGlow 11s ease-in-out infinite; pointer-events: none; }

    .card { position: relative; width: 968px; min-height: 636px; background: #0E0E11;
            border: 1px solid #1E1E22; border-radius: 18px; padding: 40px 56px 34px;
            display: flex; flex-direction: column;
            box-shadow: 0 44px 120px rgba(0,0,0,.7);
            animation: eRise .58s cubic-bezier(.2,.8,.2,1) backwards; }
    .card::before { content: ""; position: absolute; left: 56px; right: 56px; top: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(217,180,120,.42), transparent); }

    .top { display: flex; align-items: center; gap: 11px; }
    .arch { flex: none; opacity: .82; }
    .src { font-size: 10.5px; letter-spacing: .17em; text-transform: uppercase; color: #62626B;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dur { margin-left: auto; font-size: 10.5px; letter-spacing: .17em; color: #62626B;
           font-variant-numeric: tabular-nums; }

    .rule { height: 1px; background: #1A1A1E; margin: 20px 0 0; position: relative; }
    .rule > i { position: absolute; left: 0; top: 0; height: 1px; background: #D9B478; transform-origin: left;
                transition: width .62s cubic-bezier(.2,.8,.2,1); }

    .stepName { margin-top: 26px; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase;
                color: #D9B478; font-weight: 500; }

    .q { font-family: Newsreader, Georgia, serif; font-weight: 300; font-size: 47px; line-height: 1.1;
         color: #F2F2F4; letter-spacing: -.012em; margin: 13px 0 0; max-width: 20ch; text-wrap: balance; }
    .sub { margin-top: 13px; font-size: 13.5px; line-height: 1.6; color: #8B8B93; max-width: 54ch; text-wrap: pretty; }

    .work { flex: 1; min-height: 0; padding-top: 30px; }
    .anim { animation-duration: .5s; animation-timing-function: cubic-bezier(.2,.8,.2,1); animation-fill-mode: backwards; }
    .nextA .anim { animation-name: eInA; }
    .nextB .anim { animation-name: eInB; }
    .prevA .anim { animation-name: eBackA; }
    .prevB .anim { animation-name: eBackB; }
    .anim:nth-child(2) { animation-delay: .07s; }
    .anim:nth-child(3) { animation-delay: .13s; }

    /* An underline, not a box. */
    .write { width: 100%; background: none; border: 0; border-bottom: 1px solid #26262A; padding: 0 0 13px;
             font-family: Newsreader, Georgia, serif; font-size: 21px; font-weight: 300; color: #E9E9ED;
             transition: border-color .3s ease; resize: none; min-height: 34px; line-height: 1.5; }
    .write::placeholder { color: #4A4A52; }
    .write:focus { outline: none; border-bottom-color: rgba(217,180,120,.62); }

    /* Suggestions as lines, not chips. */
    .lines { margin-top: 24px; display: flex; flex-direction: column; }
    .line { display: flex; align-items: baseline; gap: 14px; padding: 11px 0; width: 100%;
            border-bottom: 1px solid #17171A; transition: all .26s cubic-bezier(.2,.8,.2,1); }
    .line:hover { border-bottom-color: #26262A; padding-left: 7px; }
    .dash { width: 15px; height: 1px; background: #34343A; flex: none; position: relative; top: -4px;
            transition: background .26s ease, width .26s cubic-bezier(.2,.8,.2,1); }
    .line:hover .dash { background: #D9B478; width: 22px; }
    .lineT { font-size: 14.5px; color: #8B8B93; transition: color .26s ease; }
    .line:hover .lineT { color: #E9E9ED; }

    /* Choices as lines with a gold marker, not cards. */
    .pick { display: flex; gap: 20px; align-items: flex-start; width: 100%; padding: 20px 0 20px 20px;
            border-bottom: 1px solid #17171A; position: relative; transition: all .28s cubic-bezier(.2,.8,.2,1); }
    .pick::before { content: ""; position: absolute; left: 0; top: 20px; bottom: 20px; width: 2px;
                    background: #26262A; transition: background .28s ease, transform .28s ease; transform: scaleY(.5); }
    .pick:hover { padding-left: 26px; }
    .pick:hover::before { background: #34343A; transform: scaleY(1); }
    .pick.on::before { background: #D9B478; transform: scaleY(1); }
    .pickT { font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 25px; color: #BCBCC3;
             line-height: 1.2; transition: color .28s ease; min-width: 250px; }
    .pick.on .pickT { color: #F2F2F4; }
    .pickS { font-size: 13px; line-height: 1.6; color: #62626B; flex: 1; transition: color .28s ease; }
    .pick:hover .pickS, .pick.on .pickS { color: #8B8B93; }

    /* The range, as a hairline the gold sits on. */
    .time { position: relative; height: 3px; background: #1A1A1E; border-radius: 2px; margin-top: 8px; }
    .band { position: absolute; top: -1px; height: 5px; background: #D9B478; border-radius: 3px;
            transition: left .55s cubic-bezier(.2,.8,.2,1), width .55s cubic-bezier(.2,.8,.2,1);
            box-shadow: 0 0 18px rgba(217,180,120,.45); }
    .grip { position: absolute; top: -6px; width: 3px; height: 15px; background: #F0D6A6; border-radius: 2px; }
    .clock { display: flex; justify-content: space-between; margin-top: 15px; font-size: 11.5px;
             color: #4A4A52; font-variant-numeric: tabular-nums; }
    .clockNow { font-family: Newsreader, Georgia, serif; font-size: 26px; color: #F0D6A6; font-weight: 400;
                margin-top: 26px; letter-spacing: -.01em; }

    .foot { display: flex; align-items: flex-end; gap: 20px; border-top: 1px solid #1A1A1E;
            margin: 0 -56px; padding: 22px 56px 0; }
    .cost { font-size: 12px; color: #62626B; line-height: 1.6; }
    .costV { color: #BCBCC3; font-variant-numeric: tabular-nums; }
    .go { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 12px 22px;
          border-radius: 10px; background: #D9B478; color: #0E0E11; font-size: 13.5px; font-weight: 600;
          transition: all .26s cubic-bezier(.2,.8,.2,1); }
    .go:hover { background: #E4C48F; transform: translateY(-1px); box-shadow: 0 10px 26px rgba(217,180,120,.2); }
    .go svg { transition: transform .26s cubic-bezier(.2,.8,.2,1); }
    .go:hover svg { transform: translateX(4px); }
    .back { font-size: 13px; color: #62626B; transition: color .2s ease; padding: 12px 0; }
    .back:hover { color: #BCBCC3; }

    @media (prefers-reduced-motion: reduce) {
      .card, .anim, .halo { animation: none; }
      .go, .pick, .line, .band, .rule > i { transition: none; }
    }
  </style>
</helmet>

<div class="stage">
  <div class="halo"></div>

  <div class="card">
    <div class="top">
      <svg class="arch" width="15" height="19" viewBox="0 0 26 34" fill="none" stroke="#D9B478" stroke-width="1.9">
        <path d="M1.6 33V13.4a11.4 11.4 0 0 1 22.8 0V33"></path>
      </svg>
      <div class="src">MOST Muslims Don&#39;t Realize This About Allah</div>
      <div class="dur">32:16</div>
    </div>

    <div class="rule"><i style="{{ ruleStyle }}"></i></div>

    <div class="stepName">{{ stepName }}</div>
    <h1 class="q">{{ question }}</h1>
    <div class="sub">{{ sub }}</div>

    <div class="work {{ dirCls }}">

      <sc-if value="{{ isBrief }}" hint-placeholder-val="{{ true }}">
        <div>
          <div class="anim">
            <textarea class="write" placeholder="the parts about repentance, or the story he tells about his mother"></textarea>
          </div>
          <div class="lines anim">
            <sc-for list="{{ examples }}" as="e" hint-placeholder-count="4">
              <button class="line" onClick="{{ noop }}">
                <span class="dash"></span>
                <span class="lineT">{{ e.text }}</span>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isKind }}" hint-placeholder-val="{{ false }}">
        <div class="anim">
          <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="2">
            <button class="{{ k.cls }}" onClick="{{ k.pick }}">
              <div class="pickT">{{ k.title }}</div>
              <div class="pickS">{{ k.sub }}</div>
            </button>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ isTrim }}" hint-placeholder-val="{{ false }}">
        <div>
          <div class="anim">
            <div class="time">
              <div class="band" style="{{ bandStyle }}">
                <span class="grip" style="left: -2px"></span>
                <span class="grip" style="right: -2px"></span>
              </div>
            </div>
            <div class="clock"><span>0:00</span><span>32:16</span></div>
            <div class="clockNow">{{ rangeText }}</div>
          </div>
          <div class="lines anim" style="margin-top: 22px">
            <sc-for list="{{ ranges }}" as="r" hint-placeholder-count="4">
              <button class="line" onClick="{{ r.pick }}">
                <span class="dash" style="{{ r.dash }}"></span>
                <span class="lineT" style="{{ r.ink }}">{{ r.label }}</span>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>

    </div>

    <div class="foot">
      <button class="back" onClick="{{ back }}">Back</button>
      <div class="cost">
        <span class="costV">{{ tokens }} tokens</span> · ready in <span class="costV">{{ eta }}</span><br>
        {{ basis }}
      </div>
      <button class="go" onClick="{{ next }}">
        {{ cta }}
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1240,"height":880}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1, dir: 'next', flip: false, kind: 'lecture', range: 'whole' };
  }
  go(n) {
    if (n < 1 || n > 3) return;
    this.setState({ step: n, dir: n > this.state.step ? 'next' : 'prev', flip: !this.state.flip });
  }
  renderVals() {
    var self = this, s = this.state;

    var RANGES = {
      whole:  { label: 'The whole lecture', mins: 32, left: 0,  width: 100, text: '0:00 – 32:16' },
      first:  { label: 'The first twenty minutes', mins: 20, left: 0, width: 62, text: '0:00 – 20:00' },
      middle: { label: 'The middle of it', mins: 16, left: 25, width: 50, text: '8:04 – 24:12' },
      last:   { label: 'The last fifteen minutes', mins: 15, left: 53, width: 47, text: '17:16 – 32:16' },
    };
    var r = RANGES[s.range] || RANGES.whole;
    var tokens = Math.max(1, Math.ceil(r.mins));
    var lo = Math.max(4, Math.round(r.mins * 0.6)), hi = Math.max(8, Math.round(r.mins * 1.0));

    var COPY = [
      ['Brief · optional', 'What would you like clipped?',
       'Name a subject and the clipper goes looking for it. Leave it be, and it takes the strongest moments on its own.'],
      ['Two of eight', 'What are you clipping?',
       'This settles which styles fit, and whether a nasheed belongs underneath the voice.'],
      ['Three of eight', 'How much of it?',
       'This is the part you pay for, and the only number on this screen that moves the cost.'],
    ];
    var c = COPY[s.step - 1];

    return {
      ruleStyle: 'width: ' + Math.round((s.step / 8) * 100) + '%;',
      dirCls: s.dir + (s.flip ? 'A' : 'B'),
      stepName: c[0], question: c[1], sub: c[2],
      isBrief: s.step === 1, isKind: s.step === 2, isTrim: s.step === 3,

      examples: [
        { text: 'The parts about repentance and mercy' },
        { text: 'Any story he tells' },
        { text: 'Advice for young Muslims' },
        { text: 'Where he speaks about the hereafter' },
      ],

      kinds: [
        { id: 'lecture', title: 'An Islamic lecture',
          sub: 'Captions follow the speech, a nasheed sits underneath it, and your mark goes on the frame.' },
        { id: 'quran', title: 'Quran recitation',
          sub: 'The ayah and its translation, and nothing else. No nasheed, and nothing drawn over scripture.' },
      ].map(function (k) {
        return Object.assign({}, k, {
          cls: 'pick' + (s.kind === k.id ? ' on' : ''),
          pick: function () { self.setState({ kind: k.id }); },
        });
      }),

      bandStyle: 'left: ' + r.left + '%; width: ' + r.width + '%;',
      rangeText: r.text,
      ranges: Object.keys(RANGES).map(function (id) {
        var on = s.range === id;
        return {
          label: RANGES[id].label,
          dash: on ? 'background: #D9B478; width: 22px;' : '',
          ink: on ? 'color: #F0D6A6;' : '',
          pick: function () { self.setState({ range: id }); },
        };
      }),

      tokens: String(tokens),
      eta: lo + '–' + hi + ' min',
      basis: r.mins + ' minutes of source, charged once',
      cta: s.step === 3 ? 'Continue' : 'Continue',
      next: function () { self.go(s.step + 1); },
      back: function () { self.go(s.step - 1); },
      noop: function () {},
    };
  }
}
</script>
</body>
</html>
