<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Outfit, Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #D9B478; } a:hover { color: #F0D6A6; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }

    @keyframes pRise { from { opacity: 0; transform: translateY(16px); } }
    @keyframes pGlow { 0%,100% { opacity: .45; } 50% { opacity: .72; } }

    .stage { width: 900px; height: 660px; background: #09090A; position: relative;
             display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .aur { position: absolute; width: 640px; height: 640px; left: 50%; margin-left: -320px; top: -240px;
           background: radial-gradient(closest-side, rgba(217,180,120,.12), rgba(217,180,120,0) 72%);
           animation: pGlow 9s ease-in-out infinite; }

    .panel { position: relative; width: 796px; background: #121214; border: 1px solid #26262A;
             border-radius: 20px; padding: 30px 32px 26px;
             box-shadow: 0 40px 120px rgba(0,0,0,.66);
             animation: pRise .5s cubic-bezier(.2,.8,.2,1) backwards; }
    .panel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
             background: linear-gradient(90deg, transparent, rgba(217,180,120,.5), transparent); }

    .src { display: flex; gap: 13px; align-items: center; padding-bottom: 22px;
           border-bottom: 1px solid #1E1E22; margin-bottom: 24px; }
    .thumb { width: 82px; height: 46px; flex: none; border-radius: 8px; border: 1px solid #26262A;
             background: linear-gradient(135deg, #2A2118, #17171A); }
    .srcT { font-size: 14px; font-weight: 600; color: #F2F2F4; }
    .srcM { font-size: 11.5px; color: #85858E; margin-top: 3px; letter-spacing: .04em; }

    .eyebrow { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: #85858E;
               font-weight: 500; margin-bottom: 13px; }
    .list { display: flex; flex-direction: column; gap: 9px; }
    .row { display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-radius: 13px;
           border: 1px solid #26262A; background: #17171A; width: 100%;
           transition: all .24s cubic-bezier(.2,.8,.2,1); animation: pRise .5s cubic-bezier(.2,.8,.2,1) backwards; }
    .row:nth-child(1) { animation-delay: .06s; }
    .row:nth-child(2) { animation-delay: .12s; }
    .row:nth-child(3) { animation-delay: .18s; }
    .row:hover { border-color: rgba(217,180,120,.45); background: #1A1A1E; transform: translateY(-2px);
                 box-shadow: 0 12px 30px rgba(0,0,0,.38); }
    .mark { width: 38px; height: 38px; flex: none; border-radius: 10px; display: flex; align-items: center;
            justify-content: center; background: rgba(217,180,120,.1); border: 1px solid rgba(217,180,120,.28); }
    .rowT { font-size: 14px; font-weight: 600; color: #F2F2F4; }
    .rowS { font-size: 11.5px; color: #8B8B93; margin-top: 3px; line-height: 1.45; }
    .rowGo { margin-left: auto; display: flex; align-items: center; gap: 9px; }
    .cost { font-size: 11.5px; color: #85858E; font-variant-numeric: tabular-nums; }
    .arrow { color: #62626B; transition: transform .24s ease, color .24s ease; }
    .row:hover .arrow { color: #F0D6A6; transform: translateX(3px); }

    .manual { display: flex; align-items: center; gap: 11px; margin-top: 20px; padding-top: 20px;
              border-top: 1px solid #1E1E22; }
    .btn { padding: 11px 18px; border-radius: 10px; font-size: 13px; font-weight: 500;
           border: 1px solid #26262A; background: #17171A; color: #BCBCC3; transition: all .2s ease; }
    .btn:hover { border-color: #34343A; color: #F2F2F4; transform: translateY(-1px); }
    .note { font-size: 11.5px; color: #85858E; line-height: 1.5; }

    @media (prefers-reduced-motion: reduce) {
      .panel, .row, .aur { animation: none; }
      .row, .btn, .arrow { transition: none; }
    }
  </style>
</helmet>

<div class="stage">
  <div class="aur"></div>
  <div class="panel">
    <div class="src">
      <div class="thumb"></div>
      <div>
        <div class="srcT">MOST Muslims Don&#39;t Realize This About Allah</div>
        <div class="srcM">32:16 · Sheikh Abu Bakr Zoud &amp; Ustadh Hisham Abu Yusuf</div>
      </div>
    </div>

    <div class="eyebrow">Start from one of yours</div>
    <div class="list">
      <sc-for list="{{ presets }}" as="p" hint-placeholder-count="3">
        <button class="row" onClick="{{ p.pick }}">
          <div class="mark">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#D9B478" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16l-7-4-7 4z"></path></svg>
          </div>
          <div style="min-width: 0">
            <div class="rowT">{{ p.name }}</div>
            <div class="rowS">{{ p.detail }}</div>
          </div>
          <div class="rowGo">
            <div class="cost">{{ p.cost }}</div>
            <svg class="arrow" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
          </div>
        </button>
      </sc-for>
    </div>

    <div class="manual">
      <button class="btn">Set it up step by step</button>
      <div class="note">Eight questions, about a minute. Anything you land on can be saved as a new setup.</div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":900,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      presets: [
        { name: 'Friday khutbah', detail: '6 clips · 30–60s · Clean Line · rotating nasheed · YouTube, Instagram', cost: '32 tokens' },
        { name: 'Quran short', detail: '4 clips · 45–75s · Quran Recitation · scenery behind · no nasheed', cost: '32 tokens' },
        { name: 'One for testing', detail: '1 clip · 30–60s · first 5 minutes only · nothing posted', cost: '5 tokens' },
      ],
    };
  }
}
</script>
</body>
</html>
