<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141317"/><stop offset="1" stop-color="#050506"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="36%" r="58%"><stop offset="0" stop-color="#D9B478" stop-opacity=".26"/><stop offset="1" stop-color="#D9B478" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7E2B8"/><stop offset=".55" stop-color="#DFB877"/><stop offset="1" stop-color="#B98F4E"/></linearGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="url(#g)"/>
    <rect width="64" height="64" fill="url(#glow)"/>
    <!-- SOLID, with the play knocked out by evenodd. An outline this thin
         vanished among the filled silhouettes every other app uses. -->
    <path fill-rule="evenodd" fill="url(#gold)"
          d="M16 45V27a16 16 0 0 1 32 0v18Z
             M28.5 23.5 41 32 28.5 40.5Z"/>
    <!-- The wordmark is DEEN, not DEENCLIPPED: eleven characters across a 60px
         tile is a grey smear, four are readable. The label under the icon says
         the rest. Arial/Helvetica because a browser renders this SVG live and
         must not fall back to something unpredictable. -->
    <text x="32" y="56.5" text-anchor="middle" fill="#E7C88E"
          font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
          font-size="11" font-weight="700" letter-spacing="1.6">DEEN</text>
  </g>
</svg>
