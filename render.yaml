services:
  - type: web
    name: deenclipped-ai
    runtime: node
    plan: starter
    startCommand: node src/server.js
    healthCheckPath: /readyz
    disk:
      name: deenclipped-metadata
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: AUTH_REQUIRED
        value: "true"
      - key: EMAIL_SIGNIN_ENABLED
        value: "true"
      - key: EMAIL_REGISTRATION_ENABLED
        value: "false"
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://deenclipped.online
      - key: GOOGLE_SIGNIN_CLIENT_ID
        sync: false
      - key: GOOGLE_SIGNIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SIGNIN_REDIRECT_URI
        value: https://deenclipped.online/auth/google/callback
      - key: TIMEZONE
        value: Australia/Perth
      - key: PROCESSING_MODE
        value: remote
      - key: WORKER_BASE_URL
        sync: false
      - key: WORKER_SHARED_SECRET
        sync: false
      - key: WORKER_CALLBACK_SECRET
        sync: false
      - key: WORKER_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: WORKER_POLL_INTERVAL_MS
        value: "5000"
      - key: WORKER_JOB_TIMEOUT_MS
        value: "21600000"
      - key: VIDEO_IMPORT_PROVIDER
        value: ffmpegapi
      - key: VIDEO_IMPORT_API_URL
        value: https://ffmpegapi.net
      - key: VIDEO_IMPORT_API_KEY
        sync: false
      - key: VIDEO_IMPORT_ALLOWED_DOWNLOAD_HOSTS
        sync: false
      - key: VIDEO_IMPORT_POLL_INTERVAL_MS
        value: "5000"
      - key: VIDEO_IMPORT_TIMEOUT_MS
        value: "1800000"
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_URL
        sync: false
      - key: POST_TIMES
        value: 07:00,12:00,17:00,20:30
      - key: CLIP_AI_MODEL
        value: small
      - key: CLIP_AI_DEVICE
        value: cpu
      - key: CLIP_AI_COMPUTE_TYPE
        value: int8
      - key: CLIPS_PER_VIDEO
        value: "8"
      - key: CLIP_MIN_SECONDS
        value: "20"
      - key: CLIP_MAX_SECONDS
        value: "60"
      - key: MUSIC_VOLUME_PERCENT
        value: "13"
      - key: MAX_VIDEO_UPLOAD_MB
        value: "2048"
      - key: SOCIAL_PUBLISH_ENABLED
        value: "true"
      - key: SOCIAL_TOKEN_KEY
        generateValue: true
      - key: SOCIAL_MAX_ATTEMPTS
        value: "5"
      - key: SOCIAL_POLL_INTERVAL_MS
        value: "15000"
      - key: SOCIAL_PROCESSING_TIMEOUT_MS
        value: "7200000"
      - key: SOCIAL_MEDIA_URL_TTL_MS
        value: "86400000"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://deenclipped.online/auth/youtube/callback
      - key: VIZARD_API_KEY
        sync: false
      - key: VIZARD_MAX_CLIPS
        value: "8"
      - key: VIZARD_CLIP_MODEL
        value: clip_v1
      - key: VIZARD_POLL_INTERVAL_MS
        value: "30000"
      - key: VIZARD_PROCESSING_TIMEOUT_MS
        value: "5400000"
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: STRIPE_ENABLED
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_WEEKLY
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      - key: STRIPE_PRICE_TOPUP_100
        sync: false
      - key: STRIPE_PRICE_TOPUP_300
        sync: false
      - key: STRIPE_PRICE_TOPUP_750
        sync: false
