services:
  - type: web
    name: deenclipped-ai
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: deenclipped-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: EMAIL_SIGNIN_ENABLED
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://deenclipped.online
      - key: GOOGLE_SIGNIN_CLIENT_ID
        sync: false
      - key: GOOGLE_SIGNIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SIGNIN_REDIRECT_URI
        value: https://deenclipped.online/auth/google/callback
      - key: TIMEZONE
        value: Australia/Perth
      - key: POST_TIMES
        value: 07:00,12:00,17:00,20:30
      - key: CLIP_AI_MODEL
        value: small
      - key: CLIP_AI_DEVICE
        value: cpu
      - key: CLIP_AI_COMPUTE_TYPE
        value: int8
      - key: CLIPS_PER_VIDEO
        value: "8"
      - key: CLIP_MIN_SECONDS
        value: "20"
      - key: CLIP_MAX_SECONDS
        value: "60"
      - key: MUSIC_VOLUME_PERCENT
        value: "13"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: KEEP_SOURCE_FILES
        value: "true"
      - key: MAX_VIDEO_UPLOAD_MB
        value: "2048"
      - key: SOCIAL_PUBLISH_ENABLED
        value: "true"
      - key: SOCIAL_TOKEN_KEY
        generateValue: true
      - key: SOCIAL_MAX_ATTEMPTS
        value: "5"
      - key: SOCIAL_POLL_INTERVAL_MS
        value: "15000"
      - key: SOCIAL_PROCESSING_TIMEOUT_MS
        value: "7200000"
      - key: SOCIAL_MEDIA_URL_TTL_MS
        value: "86400000"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: STRIPE_PRICE_TOPUP_100
        sync: false
      - key: STRIPE_PRICE_TOPUP_300
        sync: false
      - key: STRIPE_PRICE_TOPUP_750
        sync: false
