# THIS FILE DESCRIBES THE LIVE SERVICE. IT DID NOT, AND THAT WAS A LANDMINE.
#
# `deenclipped-ai` is Blueprint managed, so this file is not documentation --
# a sync applies it. Until 7 Sept 2026 it described a service that has not
# existed for months, and applying it would have done real damage:
#
#   it said                          the live service is
#   runtime: node                    docker, built from ./Dockerfile
#   startCommand: node src/server.js (none -- the image has its own)
#   disk deenclipped-metadata, 1GB   deenclipped-data, 10GB
#   mountPath /var/data              /app/data
#   DATA_DIR /var/data               /app/data
#
# DATA_DIR is the one that matters. Pointed at a mount that does not exist,
# the app boots with an empty state.json -- every account, clip, connection
# and stored token gone from its view, on a service whose whole database is
# that file. The rest would merely have failed the build.
#
# Two values were also actively wrong:
#   OLLAMA_MODEL qwen3:4b   -- 2.5G against a 2G container cap on the box; it
#                              OOM-kills (dmesg has five of them). The box runs
#                              qwen3:1.7b, and it is set on the BOX, not here.
#   VIDEO_IMPORT_PROVIDER   -- ffmpegapi/SocialKit, removed 26 Aug 2026. The
#                              chain is yt-dlp behind the Webshare proxy pool.
#
# SECRETS ARE NEVER IN THIS FILE. `sync: false` means "this one is set in the
# Render dashboard"; the dashboard is the source of truth for every value that
# is a credential, and for anything added since a deploy.
services:
  - type: web
    name: deenclipped-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: deenclipped-v2-2
    healthCheckPath: /healthz
    disk:
      name: deenclipped-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      # ── where state lives. Must match the disk mounted above. ──
      - key: DATA_DIR
        value: /app/data
      - key: PUBLIC_BASE_URL
        value: https://deenclipped.online
      - key: TIMEZONE
        value: Australia/Perth
      - key: AUTH_REQUIRED
        value: "true"
      - key: EMAIL_SIGNIN_ENABLED
        value: "true"
      # Sessions and stored OAuth tokens. Losing either signs everyone out /
      # makes every stored channel credential unreadable, so both are set in
      # the dashboard and never regenerated casually.
      - key: APP_SESSION_SECRET
        sync: false
      - key: SOCIAL_TOKEN_KEY
        sync: false

      # ── the worker box ──
      - key: PROCESSING_MODE
        value: remote
      - key: WORKER_BASE_URL
        sync: false
      - key: WORKER_SHARED_SECRET
        sync: false
      - key: WORKER_CALLBACK_SECRET
        sync: false

      # ── media. MEDIA_PUBLIC_BASE rewrites stored r2.dev URLs at the exits;
      # the r2.dev endpoint is rate limited and must never reach a player. ──
      - key: MEDIA_PUBLIC_BASE
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false

      # ── imports: the box's own yt-dlp behind a rotating proxy pool ──
      - key: VIDEO_IMPORT_PROVIDER
        value: ytdlp

      # ── billing. Without these a customer can be charged and not credited. ──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_TRIAL_DAYS
        value: "7"

      # ── product email: verification, nudges, the "your clip is live" mail ──
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # ── sign-in and posting ──
      - key: GOOGLE_SIGNIN_CLIENT_ID
        sync: false
      - key: GOOGLE_SIGNIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SIGNIN_REDIRECT_URI
        value: https://deenclipped.online/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://deenclipped.online/auth/youtube/callback
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: SOCIAL_PUBLISH_ENABLED
        value: "true"

      # ── the sign-up robot box. Inert without both, and fails CLOSED once set. ──
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false

      # ── clipping defaults ──
      - key: POST_TIMES
        value: 07:00,12:00,17:00,20:30
      - key: CLIPS_PER_VIDEO
        value: "8"
      - key: CLIP_MIN_SECONDS
        value: "20"
      - key: CLIP_MAX_SECONDS
        value: "60"
      - key: MUSIC_VOLUME_PERCENT
        value: "13"
      - key: MAX_VIDEO_UPLOAD_MB
        value: "2048"
