services:
  - type: web
    name: clip-agent
    runtime: node
    plan: starter
    buildCommand: echo "no build step"
    startCommand: node src/server.js
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: OPUS_API_KEY
        sync: false
      - key: TIMEZONE
        value: Australia/Perth
      - key: POST_TIMES
        value: 07:00,12:00,17:00,20:30
      - key: CLIPS_PER_VIDEO
        value: "4"
      - key: AUTO_APPROVE
        value: "false"
