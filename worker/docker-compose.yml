services:
  deenclipped-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      WORKER_PORT: "8080"
      WORKER_DATA_DIR: /var/lib/deenclipped
      WORKER_TEMP_DIR: /var/lib/deenclipped/tmp
      WORKER_MAX_CONCURRENT_JOBS: "1"
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_MODEL: small
      FFMPEG_THREADS: "4"
    volumes:
      - deenclipped-worker-data:/var/lib/deenclipped
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 10G

  # Local clip ranking and titling. Without this, refine_with_ollama() returns
  # its candidates untouched and every clip is named from a raw transcript
  # fragment -- the "AI" in the product was never running.
  #
  # It lives on this box on purpose: scoring is a short phase between
  # transcription and rendering, never concurrent with them, so it borrows CPU
  # that is otherwise idle and costs nothing extra to host.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - deenclipped-ollama:/root/.ollama
    # Never published beyond the compose network -- the model must not be
    # reachable from the internet.
    expose:
      - "11434"
    deploy:
      resources:
        limits:
          # qwen3:4b at int4 sits near 3G. Capped so a model pull can never
          # squeeze transcription or ffmpeg off the box.
          memory: 5G

volumes:
  deenclipped-worker-data:
  deenclipped-ollama:
