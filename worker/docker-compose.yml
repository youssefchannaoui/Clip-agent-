services:
  deenclipped-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      WORKER_PORT: "8080"
      WORKER_DATA_DIR: /var/lib/deenclipped
      WORKER_TEMP_DIR: /var/lib/deenclipped/tmp
      # Two jobs may import/prepare/upload together. Only one model/render job
      # runs at once on the current 2-vCPU/4-GB server to prevent memory thrash.
      WORKER_MAX_CONCURRENT_JOBS: "2"
      WORKER_MAX_HEAVY_JOBS: "1"
      WORKER_JOB_TIMEOUT_MINUTES: "180"
      WORKER_CALLBACK_ATTEMPTS: "4"
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_MODEL: large-v3-turbo
      WHISPER_BEAM_SIZE: "5"
      WHISPER_CPU_THREADS: "2"
      FFMPEG_THREADS: "2"
      VIDEO_PRESET: medium
      VIDEO_CRF: "18"
    volumes:
      - deenclipped-worker-data:/var/lib/deenclipped
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 3500m

volumes:
  deenclipped-worker-data:
