services:
  deenclipped-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
      args:
        # Set per deploy by worker/deploy.sh so the yt-dlp layer misses the
        # cache and the box takes today's extractor. Unset (a hand-run
        # `docker compose build`) leaves the Dockerfile's own default, which
        # caches -- so a hand rebuild is as stale as it ever was, deliberately:
        # a value that changed on its own would rebuild that layer on every
        # local `up` as well.
        YTDLP_REFRESH: ${YTDLP_REFRESH:-unset}
    restart: unless-stopped
    # Time for service.py's SIGTERM handler to mark every running job
    # `interrupted` and stop its ffmpeg/Whisper process group before Docker
    # SIGKILLs the container. The default ten seconds was enough for the
    # marking and not always for the group.
    stop_grace_period: 45s
    env_file: .env
    environment:
      WORKER_PORT: "8080"
      WORKER_DATA_DIR: /var/lib/deenclipped
      WORKER_TEMP_DIR: /var/lib/deenclipped/tmp
      # NOT SET, DELIBERATELY: WORKER_MAX_CONCURRENT_JOBS, FFMPEG_THREADS,
      # WHISPER_DEVICE and WHISPER_COMPUTE_TYPE.
      #
      # capacity.py picks all four from the machine, and an explicit value
      # always wins -- so these lines, written for a 2-core 3.7G box, survived
      # the move to 8 cores and 15.2G and pinned the worker to exactly what it
      # could do before. Measured on the box after the resize, every one of
      # them read "FORCED": one job at a time and two ffmpeg threads on a
      # machine with eight cores. The upgrade bought nothing.
      #
      # Removing them is not a loosening: on a two-core box capacity.py returns
      # the same 1 and 2 these forced. It is the difference between a number
      # that follows the hardware and a number that was true once.
      #
      # WHISPER_MODEL *is* forced, and on purpose. capacity.py's threshold for
      # `medium` is 12G and this container's ceiling is 10G, so left alone it
      # would pick `small` -- the model CLAUDE.md names, repeatedly, as the
      # ceiling on Arabic transcription and therefore on the Quran caption sync,
      # the scoring and the ayah matching. medium is ~1.5G resident per job, so
      # four of them sit well inside 10G; the 12G threshold is a proxy for
      # "enough room", not a measurement of this model.
      #
      # This is the one setting where the heuristic is more cautious than the
      # hardware warrants, and the override exists for exactly that (SCALING.md).
      #
      # IT COSTS A JOB SLOT, and that is the point rather than a side effect:
      # capacity.py sizes a job's memory from the model, so forcing `medium`
      # takes concurrency from four to three inside this 10G ceiling. A fourth
      # medium job would not be a busier queue, it would be the container's OOM
      # killer taking one mid-render.
      WHISPER_MODEL: medium
      # Where the yt-dlp PO-token plugin finds its token server (the
      # bgutil-provider service below). Unset means no tokens, which is how
      # every import from this datacenter IP came to die on YouTube's
      # "Sign in to confirm you're not a bot" wall.
      YTDLP_POT_PROVIDER_URL: http://bgutil-provider:4416
      # The clip AI. This was never set anywhere, so the Ollama container ran
      # for weeks -- model loaded, health checks green -- and no job ever
      # called it; every title was the transcript-head fallback.
      OLLAMA_URL: http://ollama:11434
      # Sized to the box, not to preference. See the ollama memory note below.
      # qwen3:4b since the resize: CLAUDE.md records 1.7b's titling as at its
      # ceiling and names 4b as the lever, and 4b's 2.4-3.0G measured RSS is
      # what did not fit under the old 2G cap.
      OLLAMA_MODEL: qwen3:4b
    volumes:
      - deenclipped-worker-data:/var/lib/deenclipped
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          # THE CEILINGS MUST SUM TO LESS THAN THE HOST. That is the whole
          # lesson of the 42 OOM kills: a 10G limit on a 3.7G box was not a
          # limit, it was a wish, and the kernel's global OOM killer did the
          # capping instead -- taking llama-server, sometimes mid-job.
          #
          # The box is 8 cores / 15.2G, measured. 9 + 4.5 + 0.5 = 14G of
          # ceilings, leaving 1.2G for the OS and Docker.
          #
          # IT GAVE 1G TO OLLAMA AND LOST NO SLOTS, which is why the trade was
          # taken: capacity.py sizes concurrency as (limit - 0.5 reserve) /
          # 2.5G-per-medium-job, and that is 3 jobs at 10G and 3 jobs at 9G.
          # Ollama was measured at 90% of its own ceiling on a live scoring
          # pass -- 3.09 of 3.42 GiB -- which is where the 42 OOM kills in this
          # box's dmesg used to live. Spare capacity that costs nothing is
          # better spent on the cap that is nearly full than held by the one
          # that is not.
          #
          # This is also the number worker/capacity.py sizes itself against --
          # it reads the CGROUP, not the host -- which is why the worker went
          # on believing it had 2G on a 15.2G machine and would have picked
          # `base` and one job if the forces above had simply been deleted.
          # A smaller box overrides it in worker/.env. See SCALING.md.
          memory: ${WORKER_MEMORY_LIMIT:-9G}

  # Local clip ranking and titling. Without this, refine_with_ollama() returns
  # its candidates untouched and every clip is named from a raw transcript
  # fragment -- the "AI" in the product was never running.
  #
  # It lives on this box on purpose: scoring is a short phase between
  # transcription and rendering, never concurrent with them, so it borrows CPU
  # that is otherwise idle and costs nothing extra to host.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Unload the model a minute after the last scoring call instead of
      # Ollama's default five. Scoring sits between transcription and
      # rendering, so with the default the 1.8G model was still resident while
      # ffmpeg was rendering -- on a 3.8G box that is the difference between
      # rendering in RAM and rendering out of swap. Reloading costs 0.34s
      # measured, which is nothing next to a render.
      OLLAMA_KEEP_ALIVE: 60s
      # One model in memory at a time. The default is 3, and three of these
      # would not fit even with the limit below.
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - deenclipped-ollama:/root/.ollama
    # Never published beyond the compose network -- the model must not be
    # reachable from the internet.
    expose:
      - "11434"
    deploy:
      resources:
        limits:
          # qwen3:4b is 2.5G on disk and measured at 2.4-3.0G RSS. It did not
          # fit beside Whisper and ffmpeg on the old 3.7G box -- that is what
          # the OOM kills were -- and it does on this one.
          #
          # 3.5G was NOT real headroom: measured on a live scoring pass the
          # server sat at 3.09 of 3.42 GiB, 90% of its ceiling, which is the
          # occupancy the old box's kills happened at. The extra gigabyte comes
          # from the worker's cap and costs it no concurrency (see above), so
          # this is spare capacity moved to where it is actually needed rather
          # than the box being asked for more than it has.
          memory: ${OLLAMA_MEMORY_LIMIT:-4500M}

  # Mints YouTube proof-of-origin tokens for yt-dlp. Hetzner's address ranges
  # get YouTube's bot wall -- playability LOGIN_REQUIRED, "Sign in to confirm
  # you're not a bot" -- on any video its risk scoring dislikes, and a PO token
  # is what answers that wall without a Google account or cookies. The version
  # must equal bgutil-ytdlp-pot-provider in requirements.txt: the plugin warns
  # on mismatch and token minting quietly degrades.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped
    # Never published beyond the compose network -- it will mint tokens for
    # anyone who can reach it.
    expose:
      - "4416"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  deenclipped-worker-data:
  deenclipped-ollama:
