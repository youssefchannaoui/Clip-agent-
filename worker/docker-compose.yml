services:
  deenclipped-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      WORKER_PORT: "8080"
      WORKER_DATA_DIR: /var/lib/deenclipped
      WORKER_TEMP_DIR: /var/lib/deenclipped/tmp
      WORKER_MAX_CONCURRENT_JOBS: "1"
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_MODEL: large-v3-turbo
      FFMPEG_THREADS: "4"
      VIDEO_PRESET: medium
      VIDEO_CRF: "18"
    volumes:
      - deenclipped-worker-data:/var/lib/deenclipped
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 10G

volumes:
  deenclipped-worker-data:
