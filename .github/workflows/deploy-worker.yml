# Deploy the worker to the Hetzner box.
#
# The worker half of this project is manual, and that has cost it weeks twice:
# every worker change committed, green, pushed -- and not running, because
# nobody SSHed in. Render takes the web app on push; nothing took the box.
#
# This is what takes the box. It runs automatically when a push to the deploy
# branch touches worker/, and it can be triggered by hand (or by an agent that
# cannot SSH but can dispatch a workflow) at any time.
#
# ARMING IT, once. Settings -> Secrets and variables -> Actions -> New
# repository secret. EITHER of these works, and the key is preferred:
#
#   WORKER_SSH_KEY       the PRIVATE key that opens the box -- the contents of
#                        ~/.ssh/deenclipped_worker, whole file, BEGIN and END
#                        lines included. It lives on the Mac.
#   WORKER_SSH_PASSWORD  the box's root password. The fallback that can be
#                        armed from a PHONE, where the key file is out of
#                        reach: the Hetzner Cloud console can set one on the
#                        server, and it pastes straight into the secret.
#                        Adding WORKER_SSH_KEY later leaves this one unused.
#                        CAVEAT, unverified from here: a box provisioned with
#                        an SSH key usually has `PasswordAuthentication no`, and
#                        then this path cannot work until that is flipped in
#                        /etc/ssh/sshd_config -- which needs the box. If the run
#                        fails on "Permission denied (publickey)" with a
#                        password armed, that is what happened; use the key.
#
# WORKER_HOST and WORKER_USER are optional overrides; without them this uses
# the box in CLAUDE.md.
#
# Nothing here echoes either credential, and the run fails loudly rather than
# quietly if neither is set -- a deploy that silently did nothing is the exact
# failure this workflow exists to end.
name: Deploy worker

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy is being run
        required: false
        default: manual
      # The probe below. Off by default and dispatch-only: it spends the box's
      # own single-slot Ollama, so it must never ride a push.
      probe:
        description: Also ask the box's clip AI what each shape writes
        type: boolean
        required: false
        default: false
      probe_kind:
        description: 'Probe: title or description'
        required: false
        default: title
      probe_transcript:
        description: 'Probe: the clip transcript to write from'
        required: false
        default: >-
          Somebody asked me, my brother, I have made the same mistake again and
          again, does Allah still accept me? And I said listen carefully. The
          door does not close because you walked through it yesterday. He is
          not waiting for you to run out of chances, He is waiting for you to
          turn around. So do not let the shame keep you away from the only One
          who can lift it.
      probe_title:
        description: 'Probe: the clip''s current title, or "none" for a clip with none'
        required: false
        default: The door that never closes
      probe_lecture:
        description: 'Probe: the lecture title (the only place a speaker may come from)'
        required: false
        default: ''
      # Diagnostics. Dispatch-only and OFF by default. When on, the deploy is
      # SKIPPED -- asking the box a question must never restart a worker
      # mid-job -- and the box is asked what happened to its recent jobs:
      # counts, timings and a replay of the candidate pipeline over the cached
      # transcript at the job's own settings. Never any transcript text.
      diagnose:
        description: Only diagnose (no deploy) -- ask the box about its recent jobs
        type: boolean
        required: false
        default: false
      diagnose_hours:
        description: 'Diagnose: how many hours of cached transcripts to read back'
        required: false
        default: '12'
      diagnose_audio:
        description: 'Diagnose: seconds of the newest cached source to run Whisper over (0 = skip; loads the model, so only when the box is idle)'
        required: false
        default: '0'
      diagnose_duration:
        description: 'Diagnose: pick the cached source whose length is nearest this many seconds (0 = newest)'
        required: false
        default: '0'
  # Only worker/ code. Editing this file changes how the deploy runs, not what
  # is running on the box, so it must not trigger a deploy of its own -- an
  # unarmed run going red on every edit to the deploy script is noise, and the
  # red that matters here is "a worker change landed and did not reach the box".
  push:
    branches: [deenclipped-v2-2]
    paths:
      - 'worker/**'

permissions:
  contents: read

# One deploy at a time. Two overlapping `docker compose up --build` runs on a
# single-slot box is how a half-built image ends up serving.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check a credential is armed
        env:
          KEY: ${{ secrets.WORKER_SSH_KEY }}
          PASSWORD: ${{ secrets.WORKER_SSH_PASSWORD }}
        run: |
          if [ -n "${KEY:-}" ]; then
            echo "Deploy key present."
          elif [ -n "${PASSWORD:-}" ]; then
            echo "Deploy password present."
          else
            echo "::error::Neither WORKER_SSH_KEY nor WORKER_SSH_PASSWORD is set, so this deploy cannot reach the box."
            echo "Add ONE of these as a repository secret (Settings -> Secrets and variables -> Actions), then run this again:"
            echo "  WORKER_SSH_KEY       the contents of ~/.ssh/deenclipped_worker (it lives on the Mac)"
            echo "  WORKER_SSH_PASSWORD  the box's root password (this one can be armed from a phone)"
            exit 1
          fi

      - name: Open the connection
        env:
          KEY: ${{ secrets.WORKER_SSH_KEY }}
          HOST: ${{ secrets.WORKER_HOST || '135.181.149.182' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Pin the host key on first contact rather than disabling checking.
          ssh-keyscan -T 20 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "Known host recorded."

          # One helper, so the two steps below do not each re-derive how to
          # authenticate. Neither branch ever puts a credential on a command
          # line: the key is a file, the password is read from SSHPASS.
          if [ -n "${KEY:-}" ]; then
            # A key does not always survive the trip into a secret box intact,
            # and when it does not, ssh says "error in libcrypto" and then
            # "Permission denied" -- which reads as the WRONG KEY rather than a
            # damaged one, and sends you looking in the wrong place. Seen for
            # real on 29 Aug. So repair what can be repaired and refuse clearly
            # what cannot:
            #   - CR characters, from a paste that picked up Windows endings.
            #     One CR per line is enough to make the whole key unparseable.
            #   - A missing final newline, which OpenSSH requires.
            #   - A base64 blob, for anyone who wrapped the key to get it past
            #     a form that mangles multi-line text (base64 <key> | pbcopy).
            if printf '%s' "$KEY" | grep -q 'BEGIN .*PRIVATE KEY'; then
              printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/worker_key
            else
              printf '%s' "$KEY" | tr -d '\r\n \t' | base64 -d > ~/.ssh/worker_key 2>/dev/null || {
                echo "::error::WORKER_SSH_KEY is neither a private key nor base64 of one."
                echo "It must be the whole of ~/.ssh/deenclipped_worker -- the file WITHOUT"
                echo ".pub, BEGIN and END lines included -- or: base64 < ~/.ssh/deenclipped_worker"
                exit 1
              }
            fi
            if [ -n "$(tail -c1 ~/.ssh/worker_key)" ]; then printf '\n' >> ~/.ssh/worker_key; fi
            chmod 600 ~/.ssh/worker_key
            # Prove it parses BEFORE offering it, so a damaged key is named as
            # damaged instead of arriving as a permission denial. -P '' rather
            # than no -P: a passphrase-protected key would otherwise sit here
            # waiting for input that never comes.
            if ! ssh-keygen -y -P '' -f ~/.ssh/worker_key >/dev/null 2>&1; then
              echo "::error::The key in WORKER_SSH_KEY will not parse."
              echo "Either it is damaged, it is a .pub file, or it has a passphrase."
              echo "Re-add it with:  base64 < ~/.ssh/deenclipped_worker | pbcopy"
              exit 1
            fi
            echo "Key parsed cleanly."
            cat > "$RUNNER_TEMP/rssh" <<'HELPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec ssh -i ~/.ssh/worker_key -o BatchMode=yes -o ConnectTimeout=25 \
            "$USER_NAME@$HOST" "$@"
          HELPER
            echo "Authenticating with the deploy key."
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            # BatchMode would disable password auth outright, so it is absent
            # here on purpose; the other two options stop ssh falling back to
            # an interactive prompt that would hang the run instead.
            cat > "$RUNNER_TEMP/rssh" <<'HELPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec sshpass -e ssh -o ConnectTimeout=25 \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            "$USER_NAME@$HOST" "$@"
          HELPER
            echo "Authenticating with the deploy password."
          fi
          chmod 700 "$RUNNER_TEMP/rssh"

      - name: Pull and rebuild on the box
        # Skipped for a diagnose-only dispatch: a question must not become a
        # rebuild. On a push `inputs` is empty, so this runs exactly as before.
        if: inputs.diagnose != true
        env:
          HOST: ${{ secrets.WORKER_HOST || '135.181.149.182' }}
          USER_NAME: ${{ secrets.WORKER_USER || 'root' }}
          RAW_PASSWORD: ${{ secrets.WORKER_SSH_PASSWORD }}
        run: |
          # Strip CR/LF only. A password pasted into GitHub's secret box can
          # carry a trailing newline, and sshpass would then offer the password
          # PLUS that newline -- refused, and indistinguishable from the box
          # having password login switched off. That false negative would send
          # someone down entirely the wrong road. Spaces are left alone: a
          # newline can never be part of a password typed into a form, a space
          # can.
          export SSHPASS="$(printf '%s' "${RAW_PASSWORD:-}" | tr -d '\r\n')"
          "$RUNNER_TEMP/rssh" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/deenclipped
          echo "--- before ---"
          git log --oneline -1
          git fetch --all --prune
          git checkout deenclipped-v2-2
          git pull --ff-only
          echo "--- after ---"
          git log --oneline -1
          df -h / | tail -1
          bash worker/deploy.sh
          REMOTE

      - name: Prove the running container holds this commit
        # A diagnose-only dispatch deployed nothing, so there is nothing to
        # prove -- and the box legitimately holds whatever it last built,
        # which is behind any commit that touched only src/. The diagnostics
        # step prints the running version instead.
        if: inputs.diagnose != true
        env:
          HOST: ${{ secrets.WORKER_HOST || '135.181.149.182' }}
          USER_NAME: ${{ secrets.WORKER_USER || 'root' }}
          RAW_PASSWORD: ${{ secrets.WORKER_SSH_PASSWORD }}
        run: |
          export SSHPASS="$(printf '%s' "${RAW_PASSWORD:-}" | tr -d '\r\n')"
          # A clean build log proves nothing -- Docker will happily rebuild an
          # identical image from cache. The only trustworthy check reads the
          # version out of the RUNNING container and compares it with this
          # commit's package.json.
          expected=$(node -p "require('./package.json').version")
          echo "This commit is v$expected"
          running=$("$RUNNER_TEMP/rssh" \
            "docker exec worker-deenclipped-worker-1 python3 -c \"import json;print(json.load(open('/app/package.json'))['version'])\"" \
            | tr -d '\r\n[:space:]')
          echo "The box is running v$running"
          if [ "$running" != "$expected" ]; then
            echo "::error::The container is on v$running but this commit is v$expected -- the deploy did not land."
            exit 1
          fi
          echo "Deployed and verified: the running worker is v$running."

      # DISPATCH ONLY, and off unless asked for. On a push the `inputs`
      # context is empty, so this is skipped and the deploy path is exactly
      # what it was.
      #
      # WHY IT LIVES IN THE DEPLOY WORKFLOW. The connection to the box is one
      # thing, and a second copy of it is a second thing to keep in step with
      # a credential format that has already been mis-pasted twice. And a
      # probe that runs immediately after the version proof is a probe whose
      # answers you know the version of -- which is the whole point of asking.
      - name: Ask the box's clip AI what each shape writes
        if: inputs.probe == true
        env:
          HOST: ${{ secrets.WORKER_HOST || '135.181.149.182' }}
          USER_NAME: ${{ secrets.WORKER_USER || 'root' }}
          RAW_PASSWORD: ${{ secrets.WORKER_SSH_PASSWORD }}
          PROBE_KIND: ${{ inputs.probe_kind }}
          PROBE_TEXT: ${{ inputs.probe_transcript }}
          PROBE_TITLE: ${{ inputs.probe_title }}
          PROBE_LECTURE: ${{ inputs.probe_lecture }}
        run: |
          set -euo pipefail
          export SSHPASS="$(printf '%s' "${RAW_PASSWORD:-}" | tr -d '\r\n')"
          # NOTHING FROM A DISPATCH INPUT IS EVER INTERPOLATED INTO A SHELL
          # COMMAND. The inputs are read from the environment by node, written
          # into the probe as a JSON literal, and carried over as ONE base64
          # blob -- and base64 has no shell metacharacter in it, so an input
          # cannot become a command on the box.
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync(".github/scripts/clip-ai-probe.py", "utf8");
            if (!src.includes("PARAMS = {}")) throw new Error("the probe lost its PARAMS seam");
            // "none" is a SENTINEL, and it has to be: a workflow_dispatch
            // input passed as an empty string is treated as not supplied and
            // falls back to its default, so there is otherwise no way to ask
            // for the no-current-title case. Cost a wasted run on 4 Sept to
            // discover -- run 48 was identical to 47 and proved nothing.
            const asked = (name) => {
              const value = (process.env[name] || "").trim();
              return value.toLowerCase() === "none" ? "" : value;
            };
            const params = {
              kind: process.env.PROBE_KIND || "title",
              text: asked("PROBE_TEXT"),
              title: asked("PROBE_TITLE"),
              lectureTitle: asked("PROBE_LECTURE"),
            };
            fs.writeFileSync(process.env.RUNNER_TEMP + "/clip-ai-probe.py",
              src.replace("PARAMS = {}", "PARAMS = " + JSON.stringify(params)));
          '
          BLOB=$(base64 -w0 < "$RUNNER_TEMP/clip-ai-probe.py")
          "$RUNNER_TEMP/rssh" "PROBE_B64=$BLOB bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /tmp/dc-clip-ai-probe.py' EXIT
          printf '%s' "$PROBE_B64" | base64 -d > /tmp/dc-clip-ai-probe.py
          # Run it INSIDE the container: WORKER_SHARED_SECRET is already in
          # that environment and the worker answers on 127.0.0.1, so the
          # secret is never written to disk, never put on a command line and
          # never crosses the wire. Only the model's answer comes back.
          docker exec -i worker-deenclipped-worker-1 python3 - < /tmp/dc-clip-ai-probe.py
          REMOTE

      # DISPATCH ONLY, off unless asked for, and it deploys nothing (the
      # rebuild step above is skipped when this is on). The service removes a
      # failed job's working directory and never echoes the child's progress
      # events, so `docker logs` cannot say WHY a run produced no clips; the
      # payload, the status and the cached transcript on the box can. This
      # replays the candidate pipeline over that transcript inside the
      # container and prints counts -- never a word of the transcript.
      - name: Ask the box what happened to its recent jobs
        if: inputs.diagnose == true
        env:
          HOST: ${{ secrets.WORKER_HOST || '135.181.149.182' }}
          USER_NAME: ${{ secrets.WORKER_USER || 'root' }}
          RAW_PASSWORD: ${{ secrets.WORKER_SSH_PASSWORD }}
          DIAG_HOURS: ${{ inputs.diagnose_hours }}
          DIAG_AUDIO: ${{ inputs.diagnose_audio }}
          DIAG_DURATION: ${{ inputs.diagnose_duration }}
        run: |
          set -euo pipefail
          export SSHPASS="$(printf '%s' "${RAW_PASSWORD:-}" | tr -d '\r\n')"
          # Same rule as the probe: no dispatch input is ever interpolated into
          # a shell command. It becomes a JSON literal in the script, and the
          # script travels as one base64 blob.
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync(".github/scripts/worker-diagnose.py", "utf8");
            if (!src.includes("PARAMS = {}")) throw new Error("the diagnostics script lost its PARAMS seam");
            const num = (name, fallback) => { const v = Number.parseFloat(process.env[name] || ""); return Number.isFinite(v) && v >= 0 ? v : fallback; };
            const params = { hours: num("DIAG_HOURS", 12) || 12, jobs: 4, audio: Math.min(600, num("DIAG_AUDIO", 0)), duration: num("DIAG_DURATION", 0) };
            fs.writeFileSync(process.env.RUNNER_TEMP + "/worker-diagnose.py",
              src.replace("PARAMS = {}", "PARAMS = " + JSON.stringify(params)));
          '
          BLOB=$(base64 -w0 < "$RUNNER_TEMP/worker-diagnose.py")
          "$RUNNER_TEMP/rssh" "DIAG_B64=$BLOB bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /tmp/dc-worker-diagnose.py' EXIT
          printf '%s' "$DIAG_B64" | base64 -d > /tmp/dc-worker-diagnose.py
          echo "--- service log, last 3h, worker lines only ---"
          docker logs --since 3h worker-deenclipped-worker-1 2>&1 \
            | grep -E '^\[worker\]|Traceback|Error' \
            | sed -E 's#://[^@/ ]+@#://***@#g' | tail -n 40 || true
          echo "--- inside the container ---"
          docker exec -i worker-deenclipped-worker-1 python3 - < /tmp/dc-worker-diagnose.py
          REMOTE

      - name: Clean up the credential
        if: always()
        run: rm -f ~/.ssh/worker_key "$RUNNER_TEMP/rssh"
