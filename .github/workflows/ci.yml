name: Launch checks

on:
  pull_request:
  push:
    branches: [main, deenclipped-v2-2]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The version guard compares this commit against its parent, and the
          # default shallow clone has no parent -- which made the guard exit
          # "nothing to check" on every run while still reporting green.
          #
          # Two was not enough either. On a merge, or on a push carrying several
          # commits, HEAD^ is not the change's logical parent: a commit that
          # rewrote worker/clip_worker.py was reported as "no src/ or worker/
          # changes" on 31 Aug 2026 and sailed through. The guard also has to
          # look further back than one commit now, to catch two commits claiming
          # the same version, which needs real history rather than a stub.
          fetch-depth: 60
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check

      # Tee'd so the handover check can describe the run that actually happened
      # rather than re-running the suite to count it. pipefail keeps a failing
      # test a failing step.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      # A RED RUN WHOSE FAILURE NOBODY CAN READ IS A RED RUN NOBODY CAN ACT ON.
      # The suite prints ~10,000 TAP lines and a failure is inline, wherever it
      # happened -- so a session reading this run through an API that hands back
      # the last few thousand lines sees the counts and not the cause. That is
      # not hypothetical: it cost most of an hour on run 674. This pulls the
      # failures to the END, where every reader looks first.
      - name: Say what failed
        if: failure()
        run: |
          echo "::group::Failing tests"
          grep -n -A 22 '^not ok' test.log || echo '(no "not ok" line -- the suite died before reporting)'
          echo "::endgroup::"
          echo "::group::Counts"
          grep -E '^# (tests|pass|fail|skipped)' test.log || true
          echo "::endgroup::"

      # CLAUDE.md is the only thing that reaches a session started on a phone,
      # and its test counts are a tripwire. A count kept accurate by remembering
      # to keep it accurate drifts; this fails when the file and the suite
      # disagree.
      - name: The handover must describe this suite
        run: node scripts/check-handover.mjs --log test.log

      # Both apps announce the version, so a change that ships without a bump
      # reports itself as the previous release.
      - name: Shipping code means bumping the version
        if: github.event_name == 'push'
        run: node scripts/check-version-bump.mjs
