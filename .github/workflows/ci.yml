name: Launch checks

on:
  pull_request:
  push:
    branches: [main, deenclipped-v2-2]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check

      # Tee'd so the handover check can describe the run that actually happened
      # rather than re-running the suite to count it. pipefail keeps a failing
      # test a failing step.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      # CLAUDE.md is the only thing that reaches a session started on a phone,
      # and its test counts are a tripwire. A count kept accurate by remembering
      # to keep it accurate drifts; this fails when the file and the suite
      # disagree.
      - name: The handover must describe this suite
        run: node scripts/check-handover.mjs --log test.log

      # Both apps announce the version, so a change that ships without a bump
      # reports itself as the previous release.
      - name: Shipping code means bumping the version
        if: github.event_name == 'push'
        run: node scripts/check-version-bump.mjs
