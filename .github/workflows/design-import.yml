# Re-imports the Studio dashboard whenever the Claude Design export changes.
#
# Claude Design pushes the updated `.dc.html` to this repo through its own GitHub
# integration. That push is what triggers this workflow: it recompiles the design,
# runs the checks, and opens a pull request with the regenerated output.
#
# It opens a PR rather than committing straight to the deploy branch on purpose.
# `deenclipped-v2-2` auto-deploys to Render, so a direct commit would put an
# unreviewed design change on deenclipped.online with nobody having looked at a
# screen. Every layout regression in this repo's history passed its tests.

name: Import Claude Design

on:
  push:
    paths:
      # Broad on purpose. Claude Design's GitHub integration has never pushed to
      # this repo yet, so where it writes the export is unconfirmed. Matching any
      # .dc.html means a sync to an unexpected path still triggers a run; the
      # importer then fails loudly with "source not found" rather than silently
      # never firing. Narrow this once a real sync shows the actual path.
      - '**/*.dc.html'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run was triggered'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  # A burst of design pushes should settle into one PR, not a race.
  group: design-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile the design
        id: import
        run: |
          set -o pipefail
          # Called directly rather than through npm so the log is just the
          # importer's own output, which goes into the PR body verbatim.
          #
          # The importer exits non-zero when the export is truncated, which is the
          # failure mode to catch: a partial template compiles fine and silently
          # produces a dashboard missing most of its bindings.
          node scripts/import-design.mjs 2>&1 | tee import.log

      - name: Check and test
        run: |
          npm run check
          node --test

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/public/studio-template.generated.js src/public/studio-styles.generated.css; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The design compiled to identical output; nothing to open." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/public/ >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="design-import/${GITHUB_SHA::8}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/public/studio-template.generated.js src/public/studio-styles.generated.css
          git commit -m "Regenerate the Studio dashboard from the updated design"
          git push -u origin "$BRANCH"

          # Built as a file rather than an inline heredoc: the body carries
          # backticks and apostrophes, which are hostile to nesting a heredoc
          # inside a command substitution inside double quotes.
          {
            echo 'Generated by `.github/workflows/design-import.yml` from a Claude Design update.'
            echo
            echo 'Only `studio-template.generated.js` and `studio-styles.generated.css` change here.'
            echo '`studio-runtime.js` and `studio-adapter.js` are hand-written and untouched.'
            echo
            echo '```'
            head -4 import.log
            echo '```'
            echo
            # Bindings with no supplier mean the design added a surface that
            # studio-adapter.js does not fill yet — those screens render blank.
            if grep -q 'binding(s) used by the template' import.log; then
              sed -n '/binding(s) used by the template/,$p' import.log
            else
              echo 'All bindings have a supplier.'
            fi
            echo
            echo '**Before merging, look at the screen.** `npm start` then `/app?studio=1`,'
            echo 'or open `design/preview.html`. Every layout regression in this repo has'
            echo 'shipped with a green test suite.'
          } > pr-body.md

          gh pr create \
            --title "Regenerate the Studio dashboard from the updated design" \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --body-file pr-body.md
